name: Deploy to cPanel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    
    - name: Build Next.js application
      run: npm run build
      env:
        NEXT_PUBLIC_WP_API_URL: ${{ secrets.WP_API_URL }}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        NEXT_DISABLE_ESLINT: true
        NEXT_DISABLE_TYPECHECK: true


    - name: Deploy to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        protocol: ftps
        local-dir: ./out/
        server-dir: ./web/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          web/**
          .env*
          README.md
          wp-admin/**
          wp-content/**
          wp-includes/**
          wp-activate.php
          wp-blog-header.php
          wp-comments-post.php
          wp-config.php
          wp-config-sample.php
          wp-cron.php
          wp-links-opml.php
          wp-load.php
          wp-login.php
          wp-mail.php
          wp-settings.php
          wp-signup.php
          wp-trackback.php
          xmlrpc.php
          index.php
          license.txt
          readme.html
          llms.txt
          wp-cli.phar
          wp-cli.yml